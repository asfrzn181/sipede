<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <!-- Outer Shield -->
  <path d="M 100,10 C 160,10 190,40 190,110 C 190,180 130,225 100,235 C 70,225 10,180 10,110 C 10,40 40,10 100,10 Z" fill="#ffffff" stroke="#1e293b" stroke-width="6"/>
  <!-- Gold Border Inset -->
  <path d="M 100,20 C 150,20 178,46 178,110 C 178,170 125,212 100,222 C 75,212 22,170 22,110 C 22,46 50,20 100,20 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Inner Shield Header -->
  <path d="M 28,105 C 28,52 54,30 100,30 C 146,30 172,52 172,105 Z" fill="url(#redGrad)"/>
  <path d="M 28,105 C 28,160 75,200 100,210 C 125,200 172,160 172,105 Z" fill="#ffffff"/>
  <!-- Central Star -->
  <polygon points="100,45 106,63 125,63 110,74 116,92 100,81 84,92 90,74 75,63 94,63" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
  <!-- Rice and Cotton / Laurels -->
  <path d="M 50,150 C 45,120 55,90 65,75" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 150,150 C 155,120 145,90 135,75" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <!-- Center Pillar / Monogram -->
  <rect x="94" y="105" width="12" height="60" rx="3" fill="#1e293b"/>
  <polygon points="100,95 86,110 114,110" fill="#1e293b"/>
  <rect x="82" y="165" width="36" height="8" rx="2" fill="#1e293b"/>
  <!-- Ribbon -->
  <path d="M 40,195 Q 100,215 160,195 Q 140,225 100,225 Q 60,225 40,195 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
  <text x="100" y="215" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#78350f" letter-spacing="1">DPRD</text>
</svg>

