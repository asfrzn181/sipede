name: Deploy SIPEDE ke cPanel Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy ke cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 1. Ambil Kode Sumber (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ 2. Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, mysqli, gd, zip
          coverage: none

      - name: 📦 3. Install Vendor Dependencies (Composer)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: 🚀 4. Upload & Deploy ke cPanel via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            database/**
            **/*.sql
            **/*.txt
            **/application/logs/**
            .env
            .env.example
            README.md
            rbac_tambahan_sql.txt

